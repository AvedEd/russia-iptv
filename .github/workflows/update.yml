name: Update Russia IPTV V6

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    paths:
      - "scripts/build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: russia-iptv-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ======================================================
      # FFmpeg / ffprobe
      # ======================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

          echo "ffprobe version:"
          ffprobe -version | head -n 1

      # ======================================================
      # Build IPTV
      # ======================================================

      - name: Build Russia IPTV V6
        run: |
          python scripts/build.py

      # ======================================================
      # Show report
      # ======================================================

      - name: Show build report
        run: |
          echo "========================================"
          echo "Russia IPTV V6 BUILD REPORT"
          echo "========================================"

          if [ -f output/report.json ]; then
            cat output/report.json
          else
            echo "ERROR: output/report.json not found"
            exit 1
          fi

          echo
          echo "========================================"

      # ======================================================
      # Check generated playlists
      # ======================================================

      - name: Check playlists
        run: |
          echo "Generated files:"
          ls -lh output/

          echo
          echo "Playlist line counts:"
          wc -l output/*.m3u || true

          echo
          echo "Playlist entry counts:"
          for file in output/*.m3u; do
            count=$(grep -c '^#EXTINF:' "$file" || true)
            echo "$(basename "$file"): $count"
          done

      # ======================================================
      # Git configuration
      # ======================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ======================================================
      # Commit generated files
      # ======================================================

      - name: Commit generated playlists
        run: |
          git add output/

          if git diff --cached --quiet; then
            echo "No changes in output/"
            exit 0
          fi

          git commit -m "Update Russia IPTV V6"

      # ======================================================
      # Sync with remote main
      # ======================================================

      - name: Sync with remote
        run: |
          echo "Fetching latest remote main..."

          git fetch origin main

          echo "Rebasing local commit onto latest origin/main..."

          git rebase origin/main

      # ======================================================
      # Push
      # ======================================================

      - name: Push changes
        run: |
          echo "Pushing updated playlists..."

          git push origin HEAD:main

          echo "Push completed successfully."
