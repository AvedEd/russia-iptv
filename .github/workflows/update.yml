name: Update Russia IPTV V7.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: russia-iptv-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Build Russia IPTV V7.1
        run: |
          python scripts/build.py

      - name: Validate build
        run: |
          test -f output/report.json
          test -f output/russia.m3u
          test -f output/russia-best.m3u
          test -f output/russia-backup.m3u
          test -f output/russia-fhd.m3u
          test -f output/russia-4k.m3u
          test -f output/russia-hdr.m3u
          echo "All main playlists exist."

      - name: Create short playlist aliases
        run: |
          cp output/russia-best.m3u output/best.m3u
          cp output/russia.m3u output/all.m3u
          cp output/russia-fhd.m3u output/fhd.m3u
          cp output/russia-4k.m3u output/4k.m3u
          cp output/russia-backup.m3u output/backup.m3u

          echo "Short playlist aliases:"
          ls -lh output/*.m3u

      - name: Show report
        run: |
          echo "=========================================="
          echo "RUSSIA IPTV V7.1 REPORT"
          echo "=========================================="
          cat output/report.json
          echo
          echo "=========================================="

      - name: Show playlist statistics
        run: |
          echo "PLAYLISTS"
          echo "========="

          for file in output/*.m3u; do
            if [ -f "$file" ]; then
              count=$(grep -c '^#EXTINF:' "$file" || true)
              size=$(du -h "$file" | cut -f1)

              echo "$(basename "$file")"
              echo "  entries: $count"
              echo "  size:    $size"
            fi
          done

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated files
        run: |
          git add output/

          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi

          git commit -m "Update Russia IPTV V7.1"

      - name: Sync with remote main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push generated files
        run: |
          git push origin HEAD:main

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./output"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Pages URL
        run: |
          echo "=========================================="
          echo "GITHUB PAGES DEPLOYED"
          echo "=========================================="
          echo "URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo
          echo "PLAYLIST:"
          echo "${{ steps.deployment.outputs.page_url }}best.m3u"
          echo "=========================================="
