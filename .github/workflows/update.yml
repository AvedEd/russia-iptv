nname: Update Russia IPTV V6

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    paths:
      - "scripts/build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ======================================================
      # FFmpeg / ffprobe
      # ======================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ======================================================
      # Build
      # ======================================================

      - name: Build Russia IPTV V6
        run: |
          python scripts/build.py

      # ======================================================
      # Show report
      # ======================================================

      - name: Show build report
        run: |
          echo "================ REPORT ================"
          cat output/report.json
          echo "========================================"

      # ======================================================
      # Show playlist statistics
      # ======================================================

      - name: Show playlist sizes
        run: |
          echo "Playlist files:"
          ls -lh output/

          echo
          echo "Line counts:"
          wc -l output/*.m3u || true

      # ======================================================
      # Commit
      # ======================================================

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Russia IPTV V6"
          git push
