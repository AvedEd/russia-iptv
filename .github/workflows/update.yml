name: Update Russia IPTV V7.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: russia-iptv-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Build Russia IPTV V7.1
        run: |
          python scripts/build.py

      - name: Validate build
        run: |
          test -f output/report.json
          test -f output/russia.m3u
          test -f output/russia-best.m3u
          test -f output/russia-backup.m3u
          test -f output/russia-fhd.m3u
          test -f output/russia-4k.m3u
          test -f output/russia-hdr.m3u
          echo "All main playlists exist."

      - name: Create short playlist aliases
        run: |
          cp output/russia-best.m3u output/best.m3u
          cp output/russia.m3u output/all.m3u
          cp output/russia-fhd.m3u output/fhd.m3u
          cp output/russia-4k.m3u output/4k.m3u
          cp output/russia-backup.m3u output/backup.m3u

          echo "Short aliases created:"
          ls -lh output/*.m3u

      - name: Show report
        run: |
          echo "=========================================="
          echo "RUSSIA IPTV V7.1 REPORT"
          echo "=========================================="
          cat output/report.json
          echo
          echo "=========================================="

      - name: Show playlist statistics
        run: |
          echo "MAIN PLAYLISTS"
          echo "=============="

          for file in output/*.m3u; do
            if [ -f "$file" ]; then
              count=$(grep -c '^#EXTINF:' "$file" || true)
              size=$(du -h "$file" | cut -f1)

              echo "$(basename "$file")"
              echo "  entries: $count"
              echo "  size:    $size"
            fi
          done

          echo
          echo "REGIONAL PLAYLISTS"
          echo "=================="

          if [ -d output/regions ]; then
            region_count=$(find output/regions -name '*.m3u' | wc -l)
            echo "Regional playlists: $region_count"
            find output/regions -maxdepth 1 -name '*.m3u' -print | sort
          else
            echo "No regional directory."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated files
        run: |
          git add output/

          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi

          git commit -m "Update Russia IPTV V7.1"

      - name: Sync with remote main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push
        run: |
          git push origin HEAD:main

          echo "=========================================="
          echo "V7.1 PUSH SUCCESS"
          echo "=========================================="
          echo "Short playlist:"
          echo "https://aveded.github.io/russia-iptv/best.m3u"
