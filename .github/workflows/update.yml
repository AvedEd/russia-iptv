name: Update Russia IPTV V4

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffprobe -version

      - name: Build Russia IPTV V4
        run: |
          python scripts/build.py

      - name: Show report
        run: |
          echo "=============================="
          echo "IPTV BUILD REPORT"
          echo "=============================="
          cat output/report.json

      - name: Show generated files
        run: |
          echo "=============================="
          echo "GENERATED PLAYLISTS"
          echo "=============================="
          ls -lh output/

      - name: Commit playlists
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "Update Russia IPTV V4"

            git push

          fi
