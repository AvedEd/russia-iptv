name: Update Russia IPTV V5

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffprobe -version

      - name: Build IPTV V5
        run: |
          python scripts/build.py

      - name: Show report
        run: |
          echo "========================================"
          echo "RUSSIA IPTV V5 REPORT"
          echo "========================================"
          cat output/report.json

      - name: Show playlists
        run: |
          echo "========================================"
          echo "GENERATED PLAYLISTS"
          echo "========================================"
          ls -lh output/

      - name: Count playlist entries
        run: |
          echo "========================================"
          echo "PLAYLIST COUNTS"
          echo "========================================"

          for file in output/*.m3u; do
            echo ""
            echo "FILE: $file"
            grep -c '^#EXTINF:' "$file" || true
          done

      - name: Commit playlists
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "Update Russia IPTV V5 1080p+"

            git push

          fi
